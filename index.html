<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f0"><title>雙人體型差模擬器</title>
<style>
:root{--cream:#faf7f0;--blue:#91adbb;--pink:#c99eaa;--ink:#64727a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{text-align:center;padding:20px 12px 10px}h1{font-size:22px;letter-spacing:.12em;margin:0;color:#687e89}.sub{font-size:10px;letter-spacing:.12em;color:#a29f96;margin-top:5px}.wrap{max-width:1000px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:12px}.card{background:#fffdf9;border:1px solid #eee8df;border-radius:17px;padding:12px;box-shadow:0 4px 18px #8c80700b}.stage{min-height:540px;display:flex;flex-direction:column}.toolbar,.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}button,select,input{font:inherit}button{border:1px solid #e5dfd7;background:#fffdfa;color:#69767d;border-radius:999px;padding:8px 11px;font-size:12px}button.active{background:#e5eef0;border-color:#a7bdc6;color:#506d7b}button.pink.active{background:#f3e4e7;border-color:#d4adb7}button.primary{background:#829eaa;color:white}#scene{width:100%;height:auto;min-height:390px;flex:1;margin-top:8px;border-radius:13px;background:radial-gradient(ellipse at 50% 40%,white,#faf7f0)}.legend{text-align:center;font-size:12px;padding:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 12px}h2{font-size:12px;letter-spacing:.1em;color:#8a969b;margin:14px 0 7px}.tabs{display:flex;gap:6px}.tabs button{flex:1}.field{padding:7px 0;border-bottom:1px solid #f0ece5}.fieldtop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}output{color:#91adbb;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#91adbb}.height{display:grid;grid-template-columns:1fr 1fr;gap:8px}.height label{font-size:11px;background:#f8f6f1;padding:8px;border-radius:10px}.height input{width:100%;font-size:20px;font-weight:650;border:0;background:transparent;color:#627b87}.hint{font-size:10px;color:#a09e96;line-height:1.6;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}@media(max-width:720px){.wrap{grid-template-columns:1fr;padding:8px}.stage{min-height:0;order:0}#scene{min-height:320px}.controls{order:1}header{padding-top:16px}.card{padding:10px}}
</style></head><body><header><h1>雙人體型差模擬器</h1><div class="sub">BODY PROPORTION STUDIO · MOBILE FRIENDLY</div></header>
<main class="wrap"><section class="card stage"><div class="toolbar"><b style="font-size:13px">雙人比例預覽</b><div class="row" id="views"><button class="active" data-v="front">正面</button><button data-v="side">側面</button><button data-v="back">背面</button><button data-v="45">45°</button></div></div><div class="row" style="margin-top:8px" id="poses"><button class="active" data-p="stand">並肩站立</button><button data-p="face">面對面</button><button data-p="hug">擁抱</button></div>
<svg id="scene" viewBox="0 0 660 560" role="img" aria-label="兩位角色身體比例預覽"><defs><linearGradient id="a" x2="1"><stop stop-color="#7898a7"/><stop offset=".5" stop-color="#e7f0f1"/><stop offset="1" stop-color="#8daab7"/></linearGradient><linearGradient id="b" x2="1"><stop stop-color="#b78390"/><stop offset=".5" stop-color="#fff1ee"/><stop offset="1" stop-color="#c18f9b"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter></defs><ellipse cx="330" cy="520" rx="240" ry="15" fill="#e9e2d9"/><g id="figA"></g><g id="figB"></g></svg><div class="legend"><span class="dot" style="background:#91adbb"></span>角色 A <span class="dot" style="background:#c99eaa"></span>角色 B</div><div id="delta" style="font-size:12px;text-align:center;border-top:1px solid #eee;padding-top:9px"></div></section>
<aside class="card controls"><div class="tabs"><button class="active" data-who="A">角色 A・霧霾藍</button><button class="pink" data-who="B">角色 B・豆沙粉</button></div><h2>身高設定（cm）</h2><div class="height"><label>角色 A<input id="ha" type="number" min="120" max="220" value="172"></label><label>角色 B<input id="hb" type="number" min="120" max="220" value="160"></label></div><h2>角色組合</h2><div class="row" id="pairs"><button class="active" data-pair="mm">男男</button><button data-pair="ff">女女</button><button data-pair="mf">男女</button></div><h2>身體呈現</h2><div class="row" id="present"><button class="active" data-pres="masc">男性</button><button data-pres="fem">女性</button><button data-pres="neutral">中性</button></div><h2>體型模板</h2><div class="row" id="templates"><button data-t="slim">纖細</button><button data-t="balanced">勻稱</button><button data-t="broad">寬肩</button><button data-t="athletic">健壯</button><button data-t="round">圓潤</button></div><h2>身體比例與細節</h2><div id="sliders"></div><div class="actions"><button class="primary" id="reset">重設目前角色</button><button id="save">收藏方案</button><button id="export">匯出 PNG</button></div><div id="saved" class="hint"></div><p class="hint">手機版可直接在瀏覽器操作。此為 2D 參數化人體輪廓示意，並非醫療測量或真正 3D 人體掃描。</p></aside></main>
<script>
const defs={height:["身高",120,220,"cm"],shoulder:["肩寬",25,80,"%"],waist:["腰部寬度",20,80,"%"],hip:["臀部寬度",20,85,"%"],bust:["胸部豐滿度",0,100,"%"],thigh:["大腿粗細",15,90,"%"],leg:["腿長比例",40,65,"%"],arm:["手臂粗細",15,75,"%"],muscle:["肌肉感",0,100,"%"],head:["頭部比例",35,70,"%"]};
const base={height:172,shoulder:50,waist:45,hip:50,bust:40,thigh:45,leg:52,arm:40,muscle:35,head:50,pres:"masc"};
let data={A:{...base},B:{...base,height:160,pres:"masc",shoulder:44,hip:53}},who="A",view="front",pose="stand",pair="mm";
const $=s=>document.querySelector(s);
function buildSliders(){let root=$("#sliders");root.innerHTML="";for(const [k,d] of Object.entries(defs)){let x=document.createElement("div");x.className="field";x.innerHTML='<div class="fieldtop"><label>'+d[0]+'</label><output id="o-'+k+'"></output></div><input id="s-'+k+'" type="range" min="'+d[1]+'" max="'+d[2]+'">';x.querySelector("input").oninput=e=>{data[who][k]=+e.target.value;render()};root.append(x)}}
function person(id,p,c){
  let h=p.height/172;
  let fem=p.pres==="fem", neutral=p.pres==="neutral";
  let sh=27+(p.shoulder-50)*.30, wa=18+(p.waist-45)*.22, hi=24+(p.hip-50)*.23;
  let bust=(p.bust-40)*.085*(fem?1:.48);
  let thigh=5+p.thigh*.075, leg=220-(p.leg-52)*1.4, head=11.5*p.head/50;
  let fill=id==="A"?"url(#a)":"url(#b)", stroke=id==="A"?"#7898a7":"#bd8e9a";
  let skin=id==="A"?"#e8c9b8":"#efd0c2", hair=id==="A"?"#596d78":"#80636b";
  let side=view==="side", back=view==="back", angle=view==="45";
  if(side){sh*=.48;wa*=.62;hi*=.62;bust*=.45}
  if(angle){sh*=.88;wa*=.88;hi*=.88;bust*=.7}
  let x=c, top=122, shoulderY=145, waistY=218, hipY=278;
  let torso='M'+(x-6)+' 119 Q'+(x-sh*.72)+' 119 '+(x-sh)+' 145 Q'+(x-sh-2)+' 174 '+(x-wa-bust)+' 214 Q'+(x-wa)+' 230 '+(x-hi)+' 267 Q'+(x-hi*.78)+' 286 '+x+' 290 Q'+(x+hi*.78)+' 286 '+(x+hi)+' 267 Q'+(x+wa)+' 230 '+(x+wa+bust)+' 214 Q'+(x+sh+2)+' 174 '+(x+sh)+' 145 Q'+(x+sh*.72)+' 119 '+(x+6)+' 119Z';
  let g='<ellipse cx="'+x+'" cy="518" rx="'+(hi+13)+'" ry="6" fill="#7c8589" opacity=".12"/>';
  g+='<g transform="translate(0 '+(515*(1-h))+') translate('+(c*(1-h))+' 0) scale(1 '+h+')">';
  if(back)g+='<g transform="translate('+(2*c)+' 0) scale(-1 1)">';
  if(side)g+='<g transform="translate('+(c*0.18)+' 0) scale(.72 1)">';
  if(angle)g+='<g transform="translate('+(c*.08)+' 0) scale(.9 1)">';
  g+='<g stroke-linejoin="round" stroke-linecap="round">';
  g+='<path d="M'+(x-5)+' 91 L'+(x-5)+' 123 L'+(x+5)+' 123 L'+(x+5)+' 91Z" fill="'+skin+'"/>';
  g+='<path d="M'+(x-head*.88)+' 72 Q'+(x-head)+' 45 '+x+' 43 Q'+(x+head)+' 45 '+(x+head*.88)+' 72 Q'+(x+head*.75)+' 93 '+x+' 98 Q'+(x-head*.75)+' 93 '+(x-head*.88)+' 72Z" fill="'+skin+'" stroke="#c99f91" stroke-width="1.2"/>';
  g+='<path d="M'+(x-head)+' 66 Q'+(x-head*1.08)+' 43 '+x+' 39 Q'+(x+head*1.12)+' 42 '+(x+head)+' 65 L'+(x+head*.82)+' 56 Q'+x+' 49 '+(x-head*.72)+' 58Z" fill="'+hair+'"/>';
  g+='<path d="'+torso+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.2"/>';
  if(!back){
    g+='<path d="M'+(x-sh*.62)+' 151 Q'+x+' 163 '+(x+sh*.62)+' 151" fill="none" stroke="'+stroke+'" stroke-width="1.3" opacity=".65"/>';
    if(fem||neutral)g+='<path d="M'+(x-7)+' 171 Q'+(x-13-bust)+' 181 '+(x-8)+' 193 M'+(x+7)+' 171 Q'+(x+13+bust)+' 181 '+(x+8)+' 193" fill="none" stroke="'+stroke+'" stroke-width="1.2" opacity=".6"/>';
    g+='<path d="M'+(x-wa*.72)+' 218 Q'+x+' 224 '+(x+wa*.72)+' 218" fill="none" stroke="'+stroke+'" stroke-width="1.2" opacity=".6"/>';
  }else{
    g+='<path d="M'+(x-5)+' 132 Q'+x+' 188 '+(x+4)+' 220" fill="none" stroke="'+stroke+'" stroke-width="1.2" opacity=".6"/>';
  }
  let leftLeg='M'+(x-hi*.66)+' 276 Q'+(x-hi*.45-thigh*.35)+' 315 '+(x-14-thigh*.48)+' '+leg+' Q'+(x-15)+' 493 '+(x-17)+' 510 Q'+(x-12)+' 515 '+(x-3)+' 512 L'+(x-4)+' '+leg+' Q'+(x-2)+' 330 '+(x+3)+' 282Z';
  let rightLeg='M'+(x+hi*.66)+' 276 Q'+(x+hi*.45+thigh*.35)+' 315 '+(x+14+thigh*.48)+' '+leg+' Q'+(x+15)+' 493 '+(x+17)+' 510 Q'+(x+12)+' 515 '+(x+3)+' 512 L'+(x+4)+' '+leg+' Q'+(x+2)+' 330 '+(x-3)+' 282Z';
  g+='<path d="'+leftLeg+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/><path d="'+rightLeg+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
  let armW=4+p.arm*.055, armL='M'+(x-sh*.92)+' 146 Q'+(x-sh-12)+' 183 '+(x-sh-10)+' 230 L'+(x-sh-7)+' 270 Q'+(x-sh-5)+' 279 '+(x-sh+1)+' 276 L'+(x-sh+2)+' 231 Q'+(x-sh+6)+' 190 '+(x-5)+' 157Z', armR='M'+(x+sh*.92)+' 146 Q'+(x+sh+12)+' 183 '+(x+sh+10)+' 230 L'+(x+sh+7)+' 270 Q'+(x+sh+5)+' 279 '+(x+sh-1)+' 276 L'+(x+sh-2)+' 231 Q'+(x+sh-6)+' 190 '+(x+5)+' 157Z';
  g+='<path d="'+armL+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/><path d="'+armR+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
  g+='<path d="M'+(x-4)+' 73 Q'+(x-1)+' 75 '+(x+2)+' 73" fill="none" stroke="#9b7770" stroke-width="1" opacity=".65"/>';
  if(!back)g+='<circle cx="'+(x-head*.58)+'" cy="72" r="1" fill="#6f6260"/><circle cx="'+(x+head*.58)+'" cy="72" r="1" fill="#6f6260"/>';
  g+='</g>';
  if(angle)g+='</g>';if(side)g+='</g>';if(back)g+='</g>';
  g+='</g>';return g;
}
function render(){let ca=pose==="face"?245:pose==="hug"?295:245,cb=pose==="face"?415:pose==="hug"?365:415;$("#figA").innerHTML=person("A",data.A,ca);$("#figB").innerHTML=person("B",data.B,cb);for(let [k,d] of Object.entries(defs)){let el=$("#s-"+k);if(el){el.value=data[who][k];$("#o-"+k).textContent=data[who][k]+(d[3]==="cm"?" cm":"%")}}$("#ha").value=data.A.height;$("#hb").value=data.B.height;$("#delta").textContent="身高差 "+Math.abs(data.A.height-data.B.height)+" cm　｜　A "+data.A.height+" cm　B "+data.B.height+" cm";}
function choose(id){who=id;document.querySelectorAll("[data-who]").forEach(b=>b.classList.toggle("active",b.dataset.who===id));buildSliders();render();document.querySelectorAll("[data-pres]").forEach(b=>b.classList.toggle("active",b.dataset.pres===data[who].pres))}
document.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>choose(b.dataset.who));["A","B"].forEach(id=>$("#h"+id.toLowerCase()).onchange=e=>{data[id].height=Math.max(120,Math.min(220,+e.target.value||120));render()});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pose=b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{pair=b.dataset.pair;data.A.pres=pair==="ff"?"fem":"masc";data.B.pres=pair==="mm"?"masc":pair==="ff"?"fem":"fem";document.querySelectorAll("[data-pair]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=()=>{data[who].pres=b.dataset.pres;document.querySelectorAll("[data-pres]").forEach(x=>x.classList.toggle("active",x===b));render()});
const templates={slim:{shoulder:38,waist:34,hip:38,thigh:32,muscle:15},balanced:{shoulder:50,waist:45,hip:50,thigh:45,muscle:35},broad:{shoulder:70,waist:43,hip:50,thigh:50,muscle:45},athletic:{shoulder:68,waist:38,hip:48,thigh:58,muscle:78},round:{shoulder:48,waist:68,hip:70,thigh:70,muscle:15}};
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{Object.assign(data[who],templates[b.dataset.t]);render()});
$("#reset").onclick=()=>{data[who]={...base};choose(who)};let saved=[];$("#save").onclick=()=>{saved.push(JSON.parse(JSON.stringify(data)));$("#saved").textContent="已收藏 "+saved.length+" 組方案（暫存於目前頁面）"};
$("#export").onclick=()=>{let svg=$("#scene").cloneNode(true);svg.setAttribute("xmlns","http://www.w3.org/2000/svg");let blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:"image/svg+xml"}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{let c=document.createElement("canvas");c.width=900;c.height=1200;c.getContext("2d").drawImage(img,0,0,900,1200);let a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="雙人體型差.png";a.click();URL.revokeObjectURL(url)};img.src=url};
buildSliders();render();
</script></body></html>
