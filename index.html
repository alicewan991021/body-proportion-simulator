<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f0"><title>雙人體型差模擬器</title>
<style>
:root{--cream:#faf7f0;--blue:#91adbb;--pink:#c99eaa;--ink:#64727a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{text-align:center;padding:20px 12px 10px}h1{font-size:22px;letter-spacing:.12em;margin:0;color:#687e89}.sub{font-size:10px;letter-spacing:.12em;color:#a29f96;margin-top:5px}.wrap{max-width:1000px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:12px}.card{background:#fffdf9;border:1px solid #eee8df;border-radius:17px;padding:12px;box-shadow:0 4px 18px #8c80700b}.stage{min-height:540px;display:flex;flex-direction:column}.toolbar,.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}button,select,input{font:inherit}button{border:1px solid #e5dfd7;background:#fffdfa;color:#69767d;border-radius:999px;padding:8px 11px;font-size:12px}button.active{background:#e5eef0;border-color:#a7bdc6;color:#506d7b}button.pink.active{background:#f3e4e7;border-color:#d4adb7}button.primary{background:#829eaa;color:white}#scene{width:100%;height:430px;min-height:320px;flex:1;margin-top:8px;border-radius:13px;background:radial-gradient(ellipse at 50% 40%,white,#faf7f0);display:block;touch-action:pan-y}.legend{text-align:center;font-size:12px;padding:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 12px}h2{font-size:12px;letter-spacing:.1em;color:#8a969b;margin:14px 0 7px}.tabs{display:flex;gap:6px}.tabs button{flex:1}.field{padding:7px 0;border-bottom:1px solid #f0ece5}.fieldtop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}output{color:#91adbb;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#91adbb}.height{display:grid;grid-template-columns:1fr 1fr;gap:8px}.height label{font-size:11px;background:#f8f6f1;padding:8px;border-radius:10px}.height input{width:100%;font-size:20px;font-weight:650;border:0;background:transparent;color:#627b87}.hint{font-size:10px;color:#a09e96;line-height:1.6;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}@media(max-width:720px){.wrap{grid-template-columns:1fr;padding:8px}.stage{min-height:0;order:0}#scene{height:360px;min-height:320px}.controls{order:1}header{padding-top:16px}.card{padding:10px}}
</style></head><body><header><h1>雙人體型差模擬器</h1><div class="sub">BODY PROPORTION STUDIO · 3D EDITION</div></header>
<main class="wrap"><section class="card stage"><div class="toolbar"><b style="font-size:13px">雙人立體比例預覽</b><div class="row" id="views"><button class="active" data-v="front">正面</button><button data-v="side">側面</button><button data-v="back">背面</button><button data-v="45">45°</button></div></div><div class="row" style="margin-top:8px" id="poses"><button class="active" data-p="stand">並肩站立</button><button data-p="face">面對面</button><button data-p="hug">擁抱</button></div>
<div id="scene" role="img" aria-label="可旋轉的雙人 3D 人體比例預覽"></div><div class="legend"><span class="dot" style="background:#91adbb"></span>角色 A <span class="dot" style="background:#c99eaa"></span>角色 B</div><div id="delta" style="font-size:12px;text-align:center;border-top:1px solid #eee;padding-top:9px"></div><div class="hint" style="text-align:center">用單指拖曳旋轉視角，雙指可縮放</div></section>
<aside class="card controls"><div class="tabs"><button class="active" data-who="A">角色 A・霧霾藍</button><button class="pink" data-who="B">角色 B・豆沙粉</button></div><h2>身高設定（cm）</h2><div class="height"><label>角色 A<input id="ha" type="number" min="120" max="220" value="172"></label><label>角色 B<input id="hb" type="number" min="120" max="220" value="160"></label></div><h2>角色組合</h2><div class="row" id="pairs"><button class="active" data-pair="mm">男男</button><button data-pair="ff">女女</button><button data-pair="mf">男女</button></div><h2>身體呈現</h2><div class="row" id="present"><button class="active" data-pres="masc">男性</button><button data-pres="fem">女性</button><button data-pres="neutral">中性</button></div><h2>體型模板</h2><div class="row" id="templates"><button data-t="slim">纖細</button><button data-t="balanced">勻稱</button><button data-t="broad">寬肩</button><button data-t="athletic">健壯</button><button data-t="round">圓潤</button></div><h2>身體比例與細節</h2><div id="sliders"></div><div class="actions"><button class="primary" id="reset">重設目前角色</button><button id="save">收藏方案</button><button id="export">匯出 PNG</button></div><div id="saved" class="hint"></div><p class="hint">此版本使用 WebGL 即時繪製 3D 人體模型，可旋轉檢視；屬於參數化示意模型，非醫療測量或人體掃描。</p></aside></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const defs={height:["身高",120,220,"cm"],shoulder:["肩寬",25,80,"%"],waist:["腰部寬度",20,80,"%"],hip:["臀部寬度",20,85,"%"],bust:["胸部豐滿度",0,100,"%"],thigh:["大腿粗細",15,90,"%"],leg:["腿長比例",40,65,"%"],arm:["手臂粗細",15,75,"%"],muscle:["肌肉感",0,100,"%"],head:["頭部比例",35,70,"%"]};
const base={height:172,shoulder:50,waist:45,hip:50,bust:40,thigh:45,leg:52,arm:40,muscle:35,head:50,pres:"masc"};
let data={A:{...base},B:{...base,height:160,pres:"masc",shoulder:44,hip:53}},who="A",view="front",pose="stand",pair="mm";
const $=s=>document.querySelector(s);
let scene,camera,renderer,rootA,rootB,orbit={theta:0,phi:Math.PI/2.15,distance:8.4},drag=null,pinch=0;
function init3D(){
 const host=$("#scene");scene=new THREE.Scene();scene.background=new THREE.Color("#faf7f0");
 camera=new THREE.PerspectiveCamera(34,1,.1,100);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor("#faf7f0",1);host.appendChild(renderer.domElement);renderer.domElement.style.width="100%";renderer.domElement.style.height="100%";
 scene.add(new THREE.HemisphereLight(0xffffff,0xc8b9ad,2.1));let key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(-4,7,6);scene.add(key);let fill=new THREE.DirectionalLight(0xdceaf0,1.1);fill.position.set(5,4,-4);scene.add(fill);
 const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:"#f2eee7",roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;scene.add(floor);
 rootA=new THREE.Group();rootB=new THREE.Group();scene.add(rootA,rootB);buildSliders();render3D();resize3D();new ResizeObserver(resize3D).observe(host);
 const el=renderer.domElement;
 el.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,theta:orbit.theta,phi:orbit.phi};el.setPointerCapture(e.pointerId)});
 el.addEventListener("pointermove",e=>{if(!drag)return;orbit.theta=drag.theta-(e.clientX-drag.x)*.008;orbit.phi=Math.max(.35,Math.min(2.75,drag.phi+(e.clientY-drag.y)*.006));updateCamera()});
 el.addEventListener("pointerup",()=>drag=null);el.addEventListener("pointercancel",()=>drag=null);
 el.addEventListener("wheel",e=>{orbit.distance=Math.max(5,Math.min(13,orbit.distance+e.deltaY*.008));updateCamera()},{passive:true});
 el.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
 el.addEventListener("touchmove",e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){orbit.distance=Math.max(5,Math.min(13,orbit.distance+(pinch-d)*.018));updateCamera()}pinch=d}},{passive:true});
 el.addEventListener("touchend",()=>pinch=0);
 function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
}
function resize3D(){if(!renderer)return;let w=$("#scene").clientWidth,h=$("#scene").clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();updateCamera()}
function updateCamera(){let t=orbit.theta,p=orbit.phi,d=orbit.distance;camera.position.set(Math.sin(t)*Math.sin(p)*d,Math.cos(p)*d,Math.cos(t)*Math.sin(p)*d);camera.lookAt(0,1.75,0)}
function mat(color,rough=.72){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function sphere(parent,x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);parent.add(o);return o}
function link(parent,a,b,r1,r2,m){let v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),dir=v2.clone().sub(v1),mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),16,1),m);mesh.position.copy(v1.add(v2).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());parent.add(mesh);return mesh}
function makePerson(p,id){
 let g=new THREE.Group(),skin=mat(id==="A"?"#d8b5a1":"#e5c2b2"),shirt=mat(id==="A"?"#91adbb":"#c99eaa"),pants=mat(id==="A"?"#657f8b":"#a87986"),hair=mat("#514943"),detail=mat(id==="A"?"#6f8d9b":"#ad7d89"),sh=.34+(p.shoulder-50)*.0045,wa=.235+(p.waist-45)*.0028,hip=.29+(p.hip-50)*.0035,th=.085+p.thigh*.00125,arm=.052+p.arm*.00075,head=.105*p.head/50,legH=1.58+(p.leg-52)*.019,torsoH=1.48-(p.leg-52)*.019,scale=p.height/172,fem=p.pres==="fem",mus=p.muscle/100;
 g.scale.y=scale;
 // Soft tapered limbs: overlapping rounded sections create a continuous sculpted silhouette.
 function limb(a,b,rA,rB,depthA,depthB,material){let mid=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],v=new THREE.Vector3(b[0]-a[0],b[1]-a[1],b[2]-a[2]),mesh=new THREE.Mesh(new THREE.CylinderGeometry(rB,rA,v.length(),24,1),material);mesh.position.set(...mid);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());mesh.scale.z=(depthA+depthB)/2/Math.max(.001,(rA+rB)/2);g.add(mesh);sphere(g,...a,rA,depthA,rA,material);sphere(g,...b,rB,depthB,rB,material)}
 // Legs with visible thigh, knee and calf taper.
 for(let s of [-1,1]){
  let x=s*hip*.48,outer=s*(hip*.48+th*.18);
  limb([x,legH*.56,0],[x*.96,legH*.25,.005],th*.98,th*.72,th*.78,th*.68,pants);
  limb([x*.96,legH*.25,.005],[x*.98,.16,.035],th*.72,th*.55,th*.66,th*.52,pants);
  sphere(g,x*.98,.105,.10,.105,.09,.19,pants);
  sphere(g,x,legH*.55,0,th*.94,th*1.12,th*.78,pants);
  sphere(g,x*.96,legH*.25,.005,th*.68,th*.62,th*.62,pants);
 }
 // Pelvis and torso are separate smooth masses, so waist-to-hip contrast reads clearly.
 sphere(g,0,legH+.12,0,hip*.98,.28,hip*.70,shirt);
 let rings=[
  [.16,0], [hip*.92,.10],[hip,.22],[hip*.88,.34],[wa*.96,.50],[wa,.68],
  [wa*1.05,.82],[sh*.78,1.02],[sh*.98,1.22],[sh*1.02,1.34],[sh*.78,torsoH]
 ].map(v=>new THREE.Vector2(v[0],v[1]));
 let torso=new THREE.Mesh(new THREE.LatheGeometry(rings,48),shirt);torso.position.y=legH+.12;torso.scale.z=.70;g.add(torso);
 // Chest / pectoral volume and shoulder caps.
 for(let s of [-1,1]){
  sphere(g,s*sh*.48,legH+torsoH-.23,.12,sh*.48,.22,.18,shirt);
  sphere(g,s*sh*.98,legH+torsoH-.03,0,.14,.16,.14,shirt);
  if(fem){let fullness=.045+p.bust*.00135;sphere(g,s*.115,legH+torsoH-.38,.135,.12+fullness,.13+fullness*.55,.105+fullness*.6,shirt)}
  else {sphere(g,s*.105,legH+torsoH-.38,.13,.115,.105,.105,shirt)}
 }
 // Neck, head and hair cap.
 link(g,[0,legH+torsoH-.02,0],[0,legH+torsoH+.18,0],.075,.065,skin);
 sphere(g,0,legH+torsoH+.29,0,head,head*1.25,head*.92,skin);
 sphere(g,0,legH+torsoH+.39,-.012,head*1.03,head*.57,head*.96,hair);
 // Arms hang naturally beside the torso; forearms taper toward wrists.
 for(let s of [-1,1]){
  let shoulder=[s*sh*.98,legH+torsoH-.04,0],elbow=[s*(sh+arm*.72),legH+torsoH-.67,.015],wrist=[s*(sh+arm*.66),legH+.28,.035],hand=[s*(sh+arm*.65),legH+.12,.055];
  limb(shoulder,elbow,arm*1.35,arm,arm*1.2,arm*.9,shirt);
  limb(elbow,wrist,arm*.92,arm*.68,arm*.88,arm*.65,skin);
  sphere(g,...hand,arm*.62,arm*.8,arm*.48,skin);
 }
 // Subtle sculpted anatomy accents on the front; no explicit anatomical detail.
 function curve(points,material,r=.009){let path=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)));let mesh=new THREE.Mesh(new THREE.TubeGeometry(path,20,r,8,false),material);g.add(mesh)}
 let front=.205;
 curve([[-.17,legH+torsoH-.23,front],[0,legH+torsoH-.19,front+.01],[.17,legH+torsoH-.23,front]],detail,.008);
 if(mus>.25){
  for(let s of [-1,1]){
   curve([[s*.07,legH+torsoH-.48,front+.015],[s*.085,legH+torsoH-.62,front+.012],[s*.07,legH+torsoH-.75,front]],detail,.006);
  }
  curve([[0,legH+torsoH-.52,front+.018],[0,legH+torsoH-.68,front+.018],[0,legH+torsoH-.82,front]],detail,.005);
 }
 return g
}
function clearGroup(g){while(g.children.length){let o=g.children.pop();o.geometry?.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}}}
function render3D(){if(!scene)return;clearGroup(rootA);clearGroup(rootB);let a=makePerson(data.A,"A"),b=makePerson(data.B,"B");rootA.add(a);rootB.add(b);rootA.position.x=pose==="face"?-1.05:-.82;rootB.position.x=pose==="face"?1.05:.82;if(pose==="face"){rootA.rotation.y=-Math.PI/2;rootB.rotation.y=Math.PI/2}else if(view==="back"){rootA.rotation.y=Math.PI;rootB.rotation.y=Math.PI}else{rootA.rotation.y=0;rootB.rotation.y=0}if(pose==="hug"){rootA.position.x=-.55;rootB.position.x=.55}orbit.theta=view==="side"?Math.PI/2:view==="back"?Math.PI:view==="45"?Math.PI/4:0;updateCamera();for(let [k,d] of Object.entries(defs)){let el=$("#s-"+k);if(el){el.value=data[who][k];$("#o-"+k).textContent=data[who][k]+(d[3]==="cm"?" cm":"%")}}$("#ha").value=data.A.height;$("#hb").value=data.B.height;$("#delta").textContent="身高差 "+Math.abs(data.A.height-data.B.height)+" cm　｜　A "+data.A.height+" cm　B "+data.B.height+" cm"}
function buildSliders(){let root=$("#sliders");root.innerHTML="";for(const [k,d] of Object.entries(defs)){let x=document.createElement("div");x.className="field";x.innerHTML='<div class="fieldtop"><label>'+d[0]+'</label><output id="o-'+k+'"></output></div><input id="s-'+k+'" type="range" min="'+d[1]+'" max="'+d[2]+'">';x.querySelector("input").oninput=e=>{data[who][k]=+e.target.value;render3D()};root.append(x)}}
function choose(id){who=id;document.querySelectorAll("[data-who]").forEach(b=>b.classList.toggle("active",b.dataset.who===id));buildSliders();render3D();document.querySelectorAll("[data-pres]").forEach(b=>b.classList.toggle("active",b.dataset.pres===data[who].pres))}
document.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>choose(b.dataset.who));["A","B"].forEach(id=>$("#h"+id.toLowerCase()).onchange=e=>{data[id].height=Math.max(120,Math.min(220,+e.target.value||120));render3D()});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("active",x===b));render3D()});
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pose=b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x===b));render3D()});
document.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{pair=b.dataset.pair;data.A.pres=pair==="ff"?"fem":"masc";data.B.pres=pair==="mm"?"masc":"fem";document.querySelectorAll("[data-pair]").forEach(x=>x.classList.toggle("active",x===b));render3D()});
document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=()=>{data[who].pres=b.dataset.pres;document.querySelectorAll("[data-pres]").forEach(x=>x.classList.toggle("active",x===b));render3D()});
const templates={slim:{shoulder:38,waist:34,hip:38,thigh:32,muscle:15},balanced:{shoulder:50,waist:45,hip:50,thigh:45,muscle:35},broad:{shoulder:70,waist:43,hip:50,thigh:50,muscle:45},athletic:{shoulder:68,waist:38,hip:48,thigh:58,muscle:78},round:{shoulder:48,waist:68,hip:70,thigh:70,muscle:15}};
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{Object.assign(data[who],templates[b.dataset.t]);render3D()});
$("#reset").onclick=()=>{data[who]={...base};choose(who)};let saved=[];$("#save").onclick=()=>{saved.push(JSON.parse(JSON.stringify(data)));$("#saved").textContent="已收藏 "+saved.length+" 組方案（暫存於目前頁面）"};
$("#export").onclick=()=>{renderer.render(scene,camera);let a=document.createElement("a");a.href=renderer.domElement.toDataURL("image/png");a.download="雙人體型差-3D.png";a.click()};
init3D();
</script></body></html>
